name: Build Windows executable

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    # Needed to publish the rolling release below.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build src/SimplePhotoGrid/SimplePhotoGrid.csproj -c Release

      # Runs anywhere, no .NET install needed on the target machine (~65 MB).
      - name: Publish self-contained
        run: >
          dotnet publish src/SimplePhotoGrid/SimplePhotoGrid.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish/standalone

      # Needs the .NET 8 Desktop Runtime installed (~200 KB).
      - name: Publish framework-dependent
        run: >
          dotnet publish src/SimplePhotoGrid/SimplePhotoGrid.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=none
          -o publish/needs-dotnet

      - uses: actions/upload-artifact@v4
        with:
          name: SimplePhotoGrid-standalone
          path: publish/standalone/SimplePhotoGrid.exe

      - uses: actions/upload-artifact@v4
        with:
          name: SimplePhotoGrid-needs-dotnet-runtime
          path: publish/needs-dotnet/SimplePhotoGrid.exe

      # Artifacts are zipped and expire after 90 days. A rolling prerelease gives a stable,
      # direct link to the raw .exe that never expires.
      - name: Publish rolling "latest-build" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp publish/standalone/SimplePhotoGrid.exe release/SimplePhotoGrid.exe
          cp publish/needs-dotnet/SimplePhotoGrid.exe release/SimplePhotoGrid-needs-dotnet-runtime.exe

          notes="Automatic build of \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA:0:7}\`.

          - **SimplePhotoGrid.exe** - standalone, .NET included, nothing to install.
          - **SimplePhotoGrid-needs-dotnet-runtime.exe** - small, needs the .NET 8 Desktop Runtime.

          Unsigned, so SmartScreen will warn on first run: More info -> Run anyway."

          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build release/*.exe --clobber
            gh release edit latest-build --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release create latest-build release/*.exe \
              --title "Latest build" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
