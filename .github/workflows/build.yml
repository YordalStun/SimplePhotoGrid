name: Build Windows executable

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build src/SimplePhotoGrid/SimplePhotoGrid.csproj -c Release

      # Runs anywhere, no .NET install needed on the target machine (~65 MB).
      - name: Publish self-contained
        run: >
          dotnet publish src/SimplePhotoGrid/SimplePhotoGrid.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish/standalone

      # Needs the .NET 8 Desktop Runtime installed (~200 KB).
      - name: Publish framework-dependent
        run: >
          dotnet publish src/SimplePhotoGrid/SimplePhotoGrid.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=none
          -o publish/needs-dotnet

      - uses: actions/upload-artifact@v4
        with:
          name: SimplePhotoGrid-standalone
          path: publish/standalone/SimplePhotoGrid.exe

      - uses: actions/upload-artifact@v4
        with:
          name: SimplePhotoGrid-needs-dotnet-runtime
          path: publish/needs-dotnet/SimplePhotoGrid.exe
