name: Build Windows executable

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    # Needed to publish the rolling release below.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build SimplePhotoGrid.sln -c Release

      # Self-contained single files: .NET is bundled, nothing to install on the target machine.
      # The Design program is a separate executable and lives beside the main one.
      - name: Publish Simple Photo Grid
        run: >
          dotnet publish src/SimplePhotoGrid/SimplePhotoGrid.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish

      - name: Publish Photo Grid Design
        run: >
          dotnet publish src/PhotoGridDesign/PhotoGridDesign.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: SimplePhotoGrid
          path: |
            publish/SimplePhotoGrid.exe
            publish/PhotoGridDesign.exe

      # Artifacts are zipped and expire after 90 days. A rolling prerelease gives a stable,
      # direct link to the raw .exe that never expires.
      - name: Publish rolling "latest-build" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          notes="Automatic build of \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA:0:7}\`.

          - **SimplePhotoGrid.exe** - the contact sheet printer. Standalone, .NET included.
          - **PhotoGridDesign.exe** - collage designs. Put it in the SAME FOLDER as
            SimplePhotoGrid.exe for the Design button to find it.

          Unsigned, so SmartScreen will warn on first run: More info -> Run anyway."

          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build publish/SimplePhotoGrid.exe publish/PhotoGridDesign.exe --clobber
            gh release edit latest-build --notes "$notes" --target "$GITHUB_SHA"

            # Drop anything left over from an earlier workflow shape, so the release
            # always carries exactly one executable. Nothing to prune is the normal
            # case and must not fail the step, hence the `|| true` on the grep.
            stale=$(gh release view latest-build --json assets --jq '.assets[].name' \
                    | grep -vxE 'SimplePhotoGrid\.exe|PhotoGridDesign\.exe' || true)
            for name in $stale; do
              gh release delete-asset latest-build "$name" --yes
            done
          else
            gh release create latest-build publish/SimplePhotoGrid.exe publish/PhotoGridDesign.exe \
              --title "Latest build" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
